name: Release

on:
  release:
    types: [published]

jobs:
  build:
    permissions:
      contents: write

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Package as zip
        run: zip -r rss-discord-bun.zip dist src package.json bun.lock config.example.json THIRD_PARTY_LICENSES.md

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          overwrite_files: true
          files: rss-discord-bun.zip
