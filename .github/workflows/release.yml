name: Release

on:
  release:
    types: [published]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun test

  build:
    needs: quality
    permissions:
      contents: write

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Package as zip
        run: zip -r rss-discord-bun.zip dist src scripts package.json bun.lock .env.example THIRD_PARTY_LICENSES.md

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          overwrite_files: true
          files: rss-discord-bun.zip
